<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Farm Calc</title>
  <meta name="description" content="Farm calculators with a sketchable notebook.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <!-- Installable on Android and iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black" (not black-translucent): the app starts below the iPhone status bar, which stops
       iOS 26 blurring the top of the app. Takes effect after re-adding the app to the home screen. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Farm Calc">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <!-- Handwriting font for the notebook (cached by the service worker for offline use) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
  <!-- Caveat has no Greek letters; Playpen Sans supplies just π θ α Σ Δ η μ ρ for the handwritten working -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@500;700&text=%CF%80%CE%B8%CE%B1%CE%A3%CE%94%CE%B7%CE%BC%CF%81&display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><rect x="7" y="6" width="10" height="4" rx="1"/><circle cx="8.5" cy="14" r=".6"/><circle cx="12" cy="14" r=".6"/><circle cx="15.5" cy="14" r=".6"/><circle cx="8.5" cy="17.5" r=".6"/><circle cx="12" cy="17.5" r=".6"/><circle cx="15.5" cy="17.5" r=".6"/></svg>
        <span>Calculators</span>
      </a>
      <a href="#/notebook" data-tab="notebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M4 7h4M4 12h4M4 17h4"/><path d="M11 15l5-5 1.5 1.5-5 5H11z"/></svg>
        <span>Notebook</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="sheet-root"></div>
  </div>
  <!-- One plain script (built from js/*.js by tools/build.py) so the app also opens straight from the folder -->
  <script src="js/bundle.js"></script>
</body>
</html>
